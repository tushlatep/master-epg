name: Deploy validated EPG
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'build_epg.py'
      - 'config.json'
      - 'test_build_epg.py'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: epg-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - id: check
        run: |
          python -c 'import json,os; c=json.load(open("config.json")); ready=any(s.get("enabled") and (s.get("redistribution_confirmed") or c.get("allow_unverified_sources")) for s in c["sources"]); print("ready="+str(ready).lower(),file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - if: steps.check.outputs.ready == 'true'
        run: python build_epg.py
      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
