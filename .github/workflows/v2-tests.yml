name: V2 strict matching tests
on:
  push:
    branches: [epg-v2-strict]
    paths: ['v2/**','.github/workflows/v2-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s v2 -p 'test_*.py' -v
