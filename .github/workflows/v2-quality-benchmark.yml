name: V2 schedule quality benchmark
on:
  push:
    branches: [epg-v2-strict]
    paths: ['.github/workflows/v2-quality-benchmark.yml']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p audit
          python - <<'PY'
          import urllib.request,gzip,json,xml.etree.ElementTree as ET
          from datetime import datetime,timezone
          from collections import Counter
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from v2.schedule_quality import quality
          from collections import defaultdict
          now=datetime.now(timezone.utc)
          urls={**{'pw_'+c:'https://epg.pw/xmltv/epg_'+c+'.xml.gz' for c in ['US','CA','GB','IN','AU']},**{'open_'+c:'https://www.open-epg.com/files/'+c+'.xml.gz' for c in ['canada','india','unitedkingdom','australia']+['unitedstates'+str(i) for i in range(1,12)]}}
          def audit(item):
              name,url=item
              try:
                  with urllib.request.urlopen(url,timeout=90) as r: data=r.read(100000001)
                  if len(data)>100000000: raise ValueError('oversized')
                  root=ET.fromstring(gzip.decompress(data) if data.startswith(bytes([31,139])) else data)
                  if root.tag!='tv': raise ValueError('not XMLTV')
                  future=Counter()
                  programmes=defaultdict(list)
                  for p in root.findall('programme'):
                      programmes[p.get('channel')].append(p.attrib)
                      try:
                          start=datetime.strptime(p.get('start',''),'%Y%m%d%H%M%S %z')
                          stop=datetime.strptime(p.get('stop',''),'%Y%m%d%H%M%S %z')
                          if stop>now and stop>start: future[p.get('channel')]+=1
                      except ValueError: pass
                  rows=[{'id':c.get('id'),'names':[n.text for n in c.findall('display-name')],'future':future[c.get('id')],'quality':quality(programmes[c.get('id')],now)} for c in root.findall('channel')]
                  Path('audit/'+name+'.json').write_text(json.dumps(rows))
                  return name,{'url':url,'channels':len(rows),'with_future':sum(r['future']>0 for r in rows)}
              except Exception as e: return name,{'url':url,'error':str(e)}
          with ThreadPoolExecutor(max_workers=2) as ex: report=dict(ex.map(audit,urls.items()))
          Path('audit/report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quality-benchmark
          path: audit/
